name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Full end-to-end suites in the Electron app. Separate job: installers are built
  # as soon as the unit tests pass; a release (tag) requires both.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: End-to-end tests (Electron, virtual display)
        run: xvfb-run -a npm run test:e2e

  build:
    needs: test
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Windows code signing, as soon as a certificate is stored in the repository's
      # secrets (WIN_CSC_LINK: the .pfx in base64, WIN_CSC_KEY_PASSWORD). Without
      # them the installers are built unsigned.
      - name: Signing certificate
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Installers will be signed."
          else
            echo "No certificate: installers are not signed."
          fi
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: saudade-${{ matrix.os }}
          if-no-files-found: error
          # latest*.yml and .blockmap: what the installed apps read to update themselves
          path: |
            release/*.exe
            release/*.deb
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap

  # Pushing a tag such as v1.1.0 publishes a GitHub release with the installers and
  # the update files; installed apps update from it (the repository must be public).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
