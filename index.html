<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemma - Lecture Incrémentale & Répétition Espacée FSRS</title>
    <meta name="description" content="Une application moderne et locale de lecture incrémentale et de répétition espacée. Extrayez des passages, générez des clozes et révisez avec FSRS." />
    <meta property="og:title" content="Gemma - Lecture Incrémentale & Répétition Espacée FSRS" />
    <meta property="og:description" content="Une application moderne et locale de lecture incrémentale et de répétition espacée. Extrayez des passages, générez des clozes et révisez avec FSRS." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress Vite HMR WebSocket connection errors as per environment instructions
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('createWebSocket') !== -1 || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason || '');
        var stack = String((e.reason && e.reason.stack) || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('createWebSocket') !== -1 || stack.indexOf('@vite/client') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-[var(--bg-faf7f2)] text-[var(--fg-28231d)] antialiased font-sans selection:bg-[var(--bg-ebe2d3)] selection:text-[var(--fg-28231d)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
